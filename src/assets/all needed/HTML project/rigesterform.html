<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rigersterform | Project</title>
    <meta name="description" content="Register page (optional). You can skip and browse products as a guest. Responsive on all devices.">
    <meta name="robots" content="noindex,follow">
    <meta property="og:title" content="Register | My Store">
    <meta property="og:description" content="Registration is optional; you can browse as a guest.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="image/logo.jpg">
    <link rel="icon" href="image/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="index.js" defer></script>
</head>
<body data-page="register">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container" aria-label="Main content">
        <noscript>
            <div class="card" style="margin-bottom:14px">
                <div class="message error">JavaScript is disabled, so registration won’t work. You can still browse products as a guest.</div>
                <div style="margin-top:10px">
                    <a class="btn primary" href="productlist.html">Skip for now</a>
                </div>
            </div>
        </noscript>

        <section class="card">
            <h1 style="margin:0 0 6px">Create account</h1>
            <p class="muted" style="margin:0">Registration is optional. You can skip and browse products as a guest.</p>
            <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap">
                <a class="btn" href="productlist.html" data-guest="true">Skip for now</a>
                <a class="btn" href="loginform.html">Login instead</a>
            </div>
        </section>

        <section style="margin-top:14px" class="card">
            <div id="auth-message" style="margin-bottom:12px"></div>

            <form id="register-form" class="form" novalidate>
                <div class="field">
                    <label for="reg-name">Full name</label>
                    <input id="reg-name" name="name" type="text" placeholder="Your name" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="reg-email">Email</label>
                    <input id="reg-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="reg-password">Password</label>
                        <input id="reg-password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required>
                    </div>
                    <div class="field">
                        <label for="reg-confirm">Confirm password</label>
                        <input id="reg-confirm" name="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="card" style="padding:12px">
                    <div class="muted" style="margin-bottom:10px">Optional personal information</div>

                    <div class="row">
                        <div class="field">
                            <label for="reg-phone">Contact</label>
                            <input id="reg-phone" name="phone" type="tel" placeholder="e.g. +977 98xxxxxxx" autocomplete="tel">
                        </div>
                        <div class="field">
                            <label for="reg-dob">Date of birth</label>
                            <input id="reg-dob" name="dob" type="date" autocomplete="bday">
                        </div>
                    </div>

                    <div class="field">
                        <label>Gender</label>
                        <div style="display:flex; gap:12px; flex-wrap:wrap; color: var(--muted)">
                            <label style="display:flex; gap:8px; align-items:center; color: var(--muted)"><input type="radio" name="gender" value="male"> Male</label>
                            <label style="display:flex; gap:8px; align-items:center; color: var(--muted)"><input type="radio" name="gender" value="female"> Female</label>
                            <label style="display:flex; gap:8px; align-items:center; color: var(--muted)"><input type="radio" name="gender" value="other"> Other</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="reg-country">Country</label>
                            <select id="reg-country" name="country">
                                <option value="">Select</option>
                                <option value="nepal">Nepal</option>
                                <option value="india">India</option>
                                <option value="china">China</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="reg-citizenship">Citizenship (file)</label>
                            <input id="reg-citizenship" name="citizenship" type="file" accept="image/*,application/pdf">
                        </div>
                    </div>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap">
                    <button class="btn primary" type="submit">Register</button>
                    <button class="btn" type="reset">Reset</button>
                    <a class="btn" href="loginform.html">I already have an account</a>
                    <a class="btn" href="productlist.html" data-guest="true">Skip for now</a>
                </div>
            </form>
        </section>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
