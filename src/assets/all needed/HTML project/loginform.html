<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loginform | Project</title>
    <meta name="description" content="Login page (optional). You can browse products as a guest. Responsive on all devices.">
    <meta name="robots" content="noindex,follow">
    <meta property="og:title" content="Login | My Store">
    <meta property="og:description" content="Login is optional; continue as guest.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="image/logo.jpg">
    <link rel="icon" href="image/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="index.js" defer></script>
</head>
<body data-page="login">
    <a class="skip-link" href="#main">Skip to content</a>

    <header id="site-header"></header>

    <main id="main" class="container" aria-label="Main content">
        <noscript>
            <div class="card" style="margin-bottom:14px">
                <div class="message error">JavaScript is disabled, so login won’t work. You can still browse products as a guest.</div>
                <div style="margin-top:10px">
                    <a class="btn primary" href="productlist.html">Continue as guest</a>
                </div>
            </div>
        </noscript>

        <section class="card">
            <h1 style="margin:0 0 6px">Login</h1>
            <p class="muted" style="margin:0">Login is optional. You can also continue as a guest.</p>
        </section>

        <section style="margin-top:14px" class="card">
            <div id="auth-message" style="margin-bottom:12px"></div>

            <form id="login-form" class="form" novalidate>
                <div class="field">
                    <label for="login-email">Email</label>
                    <input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="login-password">Password</label>
                    <input id="login-password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap">
                    <button class="btn primary" type="submit">Login</button>
                    <a class="btn" href="rigesterform.html">Create an account</a>
                    <a class="btn" href="productlist.html" data-guest="true">Continue as guest</a>
                </div>
            </form>
        </section>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
